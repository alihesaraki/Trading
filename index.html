<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Binance Futures Chart</title>
<meta name="theme-color" content="#131722">
<link rel="icon" href="assets/images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/images/favicon-192.png">
<link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
<link rel="preconnect" href="https://fapi.binance.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preload" as="image" href="assets/images/long-position.png">
<link rel="preload" as="image" href="assets/images/short-position.png">
<link rel="stylesheet" href="dist/style.css">
<script>
// Start downloading data right away, before the chart library has loaded (faster first paint)
var SYM0='BTCUSDT',TF0='1d';
var P_T=fetch('https://fapi.binance.com/fapi/v1/ticker/24hr').then(function(r){return r.json()}).catch(function(){return null});
var P_K=fetch('https://fapi.binance.com/fapi/v1/klines?symbol='+SYM0+'&interval='+TF0+'&limit=300').then(function(r){return r.json()}).catch(function(){return null});
</script>
<script defer src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<!-- Left: chart area | Right: watchlist (resizable, can be moved to the other side) -->
<div id="main">
  <div id="bar">
    <div id="tfs" role="group" aria-label="Chart timeframe"></div>
    <button id="btnTf" type="button" title="Timeframe" aria-label="Timeframe" aria-haspopup="true" aria-expanded="false"></button>
    <button id="btnType" type="button" title="Chart type" aria-label="Chart type" aria-haspopup="true" aria-controls="typemenu" aria-expanded="false"></button><button id="btnInd" type="button" title="Indicators" aria-label="Indicators" aria-haspopup="true" aria-controls="imenu" aria-expanded="false">Indicators</button><button id="btnReplay" type="button" title="Bar Replay" aria-label="Bar Replay" aria-pressed="false"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M9.5 4.5 3.5 10l6 5.5zM16.5 4.5 10.5 10l6 5.5z" fill="currentColor"/></svg><span>Replay</span></button><button id="btnWatch" type="button" title="Hide watchlist" aria-label="Hide watchlist" aria-pressed="true"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 3.5v13" stroke="currentColor" stroke-width="1.6"/><path d="M14 7h2M14 10h2M14 13h2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
  </div>
  <div id="cw"><div id="chart"></div><div id="scaleModes" role="group" aria-label="Price scale mode"><button type="button" data-price-scale="linear" aria-pressed="true" title="Linear price scale">REG</button><button type="button" data-price-scale="log" aria-pressed="false" title="Logarithmic price scale (Alt+L)">LOG</button></div><div id="scaleWarning" role="status" aria-live="polite" hidden></div><button id="jumpNow" type="button" title="Reset Chart · Go to latest" aria-label="Reset chart and return to latest" ><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 10a7 7 0 1 0 2.05-4.95L3 7"/><path d="M3 3.5V7h3.5"/></svg></button><div id="rpDim" hidden></div><div id="rpCut" hidden><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="5" cy="14.5" r="2.3" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="15" cy="14.5" r="2.3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6.4 12.7 14 3M13.6 12.7 6 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg></div><div id="rpBar" role="toolbar" aria-label="Bar Replay" hidden><span id="rpGrip" title="Drag to move"><svg viewBox="0 0 8 16" width="8" height="16" aria-hidden="true"><path d="M1 2h2v2H1zM5 2h2v2H5zM1 7h2v2H1zM5 7h2v2H5zM1 12h2v2H1zM5 12h2v2H5z" fill="currentColor"/></svg></span><button id="rpSel" type="button" title="Select starting point" aria-haspopup="true"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="5" cy="14.5" r="2.3" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="15" cy="14.5" r="2.3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6.4 12.7 14 3M13.6 12.7 6 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg><span>Select bar</span><svg viewBox="0 0 16 16" width="9" height="9" aria-hidden="true"><path d="M3.5 6 8 10.5 12.5 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><i class="rp-sep"></i><button id="rpPlay" type="button" title="Play (Shift+↓)" aria-label="Play"></button><button id="rpStep" type="button" title="Forward one bar (Shift+→)" aria-label="Forward one bar"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 4.2v11.6L13 10zM14.2 4h2.3v12h-2.3z"/></svg></button><button id="rpSpeed" type="button" title="Replay speed (updates per second)" aria-haspopup="true"><span>3x</span><svg viewBox="0 0 16 16" width="9" height="9" aria-hidden="true"><path d="M3.5 6 8 10.5 12.5 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><i class="rp-sep"></i><button id="rpLive" type="button" title="Jump to realtime" aria-label="Jump to realtime"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M3.5 4.5 9 10l-5.5 5.5zM9.5 4.5 15 10l-5.5 5.5zM16.5 4.5h1.5v11h-1.5z" fill="currentColor"/></svg><span>Jump to realtime</span></button><button id="rpExit" type="button" title="Exit replay" aria-label="Exit replay"><svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg></button></div><div id="rpToast" role="status" aria-live="polite" hidden></div><div id="tl"><span id="ttl">…</span><span id="chg"></span></div><div id="osep"></div><div id="olb"></div><div id="cd"><span id="cdPrice"></span><span id="cdTime"></span></div><div id="lg"></div><div id="iset" hidden></div><div id="ld">Loading history…</div></div>
  <div id="rpDate" role="dialog" aria-label="Select date" hidden>
    <div class="rp-dh"><b>Select date</b><button id="rpDateX" type="button" title="Close" aria-label="Close">✕</button></div>
    <label>Date <input id="rpD" type="date"></label>
    <label>Time <input id="rpT" type="time" value="00:00"></label>
    <p>Chart time zone: Asia/Tehran</p>
    <button id="rpDateGo" type="button">Select</button>
  </div>
  <div id="tfmenu" role="menu" hidden></div>
  <div id="imenu" hidden></div>
  <div id="typemenu" role="menu" aria-label="Chart type" hidden></div>
  <div id="pop" role="dialog" aria-label="Settings" hidden></div>
</div>
<div id="side">
  <div id="rs" title="Drag to resize"></div>
  <div id="hd"><div id="flt"><button data-f="" class="on">All</button><button data-f="g" class="g" title="Green flags"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M6 2h2v2h11l-2.5 5 2.5 5H8v8H6z"/></svg></button><button data-f="r" class="r" title="Red flags"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M6 2h2v2h11l-2.5 5 2.5 5H8v8H6z"/></svg></button></div><button id="mv" title="Move watchlist to the other side">⇄</button><input id="q" placeholder="Search" autocomplete="off"></div>
  <div id="cols"><span></span><span data-k="s">Symbol<i class="gr" data-i="0" title="Drag to resize (double-click to reset)"></i></span><span data-k="p">Last<i class="gr" data-i="1" title="Drag to resize (double-click to reset)"></i></span><span data-k="c">Chg%</span></div>
  <div id="list"><div id="sp"><div id="in"></div><div id="dl" hidden></div></div><div id="msg">Loading…</div></div>
</div>
<nav id="mnav" aria-label="Main navigation">
  <button type="button" data-view="watch" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 6H20M8.5 12H20M8.5 18H20M4 6h.01M4 12h.01M4 18h.01"/></svg><span>Watchlist</span></button>
  <button type="button" data-view="chart" class="on" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="7" width="4" height="9" rx="1"/><path d="M7 3.5V7M7 16v4.5"/><rect x="15" y="5" width="4" height="8" rx="1"/><path d="M17 2V5M17 13v5"/></svg><span>Chart</span></button>
  <button type="button" data-view="draw" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="17" r="2"/><circle cx="18" cy="7" r="2"/><path d="M7.5 15.5l9-7"/></svg><span>Draw</span></button>
</nav>
<div id="ctx" hidden></div>
<script defer src="dist/app.js"></script>
<script defer src="dist/indicators.js"></script>
<script defer src="dist/drawings.js"></script>
</body>
</html>
